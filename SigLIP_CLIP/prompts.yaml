# Text prompts for each class: 20 per class.
#
#   Set 1 (10 prompts):  specific        8  target-specific descriptions
#                        general         2  generic templates
#   Set 2 (10 prompts):  social          8  social-media style captions
#                        social_general  2  generic templates
#
# So each set of 10 is 80% specific (or social) and 20% general.
#
# - `name` is the readable class name that replaces {} in a prompt. Prompts without {}
#   (common in the social captions) are used as written.
# - Keys must match the folder names in data/train and data/test.
# - Every class except Flower is a grayscale photo, so those prompts avoid color words.
# - The config's `prompt_groups` picks which groups are used, for example
#   [specific, general] to reproduce the original 10-prompt setup.

