run_name: siglip_projection

model:
  name: hf-hub:timm/ViT-B-16-SigLIP
  pretrained: null

data:
  train_dir: data/train
  eval_splits:
    test: data/test
    train: data/train

prompts_file: SigLIP_CLIP/prompts.yaml
prompt_groups: [specific, general, social, social_general]

train:
  seed: 0
  include_original: true
  augment: true
  image_weight: 0.5

projection:
  enabled: true
  epochs: 300
  lr: 0.001
  temperature: 0.07
  identity_weight: 1.0

eval:
  batch_size: 32

output_dir: SigLIP_CLIP/models
