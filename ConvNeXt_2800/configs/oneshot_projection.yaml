# One-shot vector averaging + a small learned projection on top of frozen CLIP.
# Identical to oneshot_seed0.yaml except for run_name and the projection block,
# so the two runs are directly comparable. All paths are relative to the repository root.

run_name: oneshot_projection       # outputs go to <output_dir>/<run_name>/

model:
  name: convnext_base
  pretrained: laion400m_s13b_b51k

data:
  train_dir: data/train            # the one-shot image per class is picked from here
  eval_splits:                     # labeled splits to evaluate on
    test: data/test
    train: data/train              # the 16 one-shot images are left out automatically

prompts_file: ConvNeXt_2800/prompts.yaml
prompt_groups: [specific, general, social, social_general]   # 8 + 2 + 8 + 2 = 20 prompts per class

train:
  seed: 0                          # same one-shot images as oneshot_seed0
  include_original: true           # embed the original image along with its 10 augmentations
  image_weight: 0.5                # 0.5 = plain average of image and text vectors (the grid average)

projection:
  enabled: true                    # false = skip it (same as oneshot_seed0)
  epochs: 300                      # full-batch steps; trains in seconds on 496 vectors
  lr: 0.001                        # Adam learning rate
  temperature: 0.07                # lower = harder push between classes in the contrastive loss
  identity_weight: 1.0             # how strongly the projection is kept close to CLIP's original space

eval:
  batch_size: 32

output_dir: ConvNeXt_2800/models
